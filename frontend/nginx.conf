# Serves the built SPA inside the `web` container. This sits behind the host's
# nginx (which CamAppEngine manages) and Cloudflare, so TLS, the real domain
# and forwarded headers are all handled upstream — this block only has to
# resolve paths to files.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints these filenames, so a given URL's contents never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or clients keep booting the previous
    # deploy's bundle after an update.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths are React Router's, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
